# Publishes the optional run UI (the ui/ folder) to GitHub Pages.
# Optional: it does nothing until Pages is switched on (Settings -> Pages -> Source: GitHub Actions).
# The page holds no secrets. It calls the GitHub API from the browser with the visitor's own token.
name: Deploy UI

on:
  push:
    branches: [ts-prod]
    paths: ['ui/**', '.github/workflows/deploy-ui.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload the page (not the unit tests)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
